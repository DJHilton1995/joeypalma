[package]
name = "mcp-server"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros", "json"] }

# Tokio async runtime
tokio = { version = "1.37", features = ["full"] }

# JSON + serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP utilities (tracing, headers, etc.)
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }

# Rate limiting middleware
tower-rate-limit = "0.1"

# Auth header parsing
headers = "0.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# File system + path handling
tokio-util = "0.7"

# Error handling
thiserror = "1.0"
anyhow = "1.0"
